name: checking workflow functionality
concurrency:
  group: checking-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  push:

jobs:
  simple-checks:
    name: run simple checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check for changed files
      uses: dorny/paths-filter@v2
      id: changed_files
      with:
        filters: |
          shell:
            - added|modified: '**.sh'
            - added|modified: '**.bash'
          shell_2:
            - '**.sh'
            - '**.bash'
          yaml:
            - added|modified: '**.yml'
            - added|modified: '**.yaml'
        list-files: shell
    - name: check_summary_action
      id: summary_of
      uses: ipdxco/job-summary-url-action@v1.0.0
      with:
        job: run simple checks
    - name: check job summary 1
      run: |
        printf %s '${{ toJSON(steps.summary_of.outputs) }}'
        curl --head -v '${{ steps.summary_of.outputs.job_summary_raw_url }}'
        echo some summary >> "$GITHUB_JOB_SUMMARY"
    - name: Lint yaml
      run: yamllint ${{ steps.changed_files.outputs.yaml_files }}
    - name: Shellcheck
      run: shellcheck ${{ steps.changed_files.outputs.shell_files }}
    - name: check job summary 2
      if: ! cancelled()
      run: |
        curl --head -v '${{ steps.summary_of.outputs.job_summary_raw_url }}'
        sleep 5
        curl --head -v '${{ steps.summary_of.outputs.job_summary_raw_url }}'

  check-reusable:
    uses: ./.github/workflows/reusable_workflow.yaml
